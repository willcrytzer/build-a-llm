[project]
name = "build-a-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Will Crytzer", email = "willcrytzer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
]

[project.scripts]
build-a-llm = "build_a_llm:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
